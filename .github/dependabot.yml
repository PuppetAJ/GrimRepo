# Grouped so a week of minor bumps arrives as one pull request rather than twenty.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # 9.8.1 leaves a held card's magnifier open on the 3D table; later releases are still offered.
      - dependency-name: '@react-three/fiber'
        versions: ['9.8.1']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
