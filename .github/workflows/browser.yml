name: Browser suites

on:
  pull_request:
    paths-ignore:
      - '**/*.png'
      - '**/*.md'
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: true

env:
  PULL_REQUEST: >-
    [{"suite":"smoke","engine":"chromium"},{"suite":"auth","engine":"chromium"},
    {"suite":"run-mode","engine":"chromium"},{"suite":"run-3d","engine":"chromium"},{"suite":"table","engine":"chromium"},
    {"suite":"tutorial","engine":"chromium"},{"suite":"a11y","part":"pages","engine":"chromium"},
    {"suite":"a11y","part":"run","engine":"chromium"},{"suite":"a11y","part":"tables","engine":"chromium"}]
  FULL: >-
    [{"suite":"smoke","engine":"chromium"},{"suite":"auth","engine":"chromium"},
    {"suite":"leaderboard","engine":"chromium"},
    {"suite":"run-mode","engine":"chromium"},{"suite":"run-3d","engine":"chromium"},{"suite":"table","engine":"chromium"},
    {"suite":"tutorial","engine":"chromium"},{"suite":"a11y","part":"pages","engine":"chromium"},
    {"suite":"a11y","part":"run","engine":"chromium"},{"suite":"a11y","part":"tables","engine":"chromium"},
    {"suite":"smoke","engine":"firefox"},{"suite":"auth","engine":"firefox"},{"suite":"leaderboard","engine":"firefox"},
    {"suite":"run-mode","engine":"firefox"},{"suite":"run-3d","engine":"firefox"},
    {"suite":"table","engine":"firefox"},{"suite":"tutorial","engine":"firefox"},{"suite":"a11y","part":"pages","engine":"firefox"},
    {"suite":"a11y","part":"run","engine":"firefox"},{"suite":"a11y","part":"tables","engine":"firefox"}]

jobs:
  # The matrix can't read env, so a step hands it on.
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Passed through the environment, since the JSON's quotes would end a quoted shell string.
      - id: pick
        env:
          MATRIX: ${{ github.event_name == 'pull_request' && env.PULL_REQUEST || env.FULL }}
          BASE: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE" ] && changed="$(git diff --name-only "origin/$BASE...HEAD")"; then export CHANGED="$changed"; fi
          echo "matrix=$(node .github/scripts/browser-plan.mjs)" >> "$GITHUB_OUTPUT"

  browser:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: grimrepo
          POSTGRES_PASSWORD: grimrepo
          POSTGRES_DB: grimrepo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U grimrepo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://grimrepo:grimrepo@127.0.0.1:5432/grimrepo
      BETTER_AUTH_SECRET: ci-secret-not-used-for-anything-real-0123456789
      E2E_BASE_URL: http://localhost:3000
      PART: ${{ matrix.part && format('--grep @{0}', matrix.part) || '' }}
      SHARD: ${{ matrix.shard && format('--shard={0}', matrix.shard) || '' }}

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.engine }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm exec playwright install --with-deps ${{ matrix.engine }}

      - run: pnpm db:migrate

      - run: pnpm db:seed

      - run: pnpm build
        env:
          VITE_TEST_HANDLE: '1'

      - name: Start the app
        run: |
          NODE_ENV=production PORT=3000 APP_URL=http://localhost:3000 pnpm start > app.log 2>&1 &
          for i in $(seq 1 45); do
            curl -sf http://localhost:3000/health > /dev/null && exit 0
            sleep 2
          done
          echo "The app did not come up"; cat app.log; exit 1

      # A runner has no GPU. In a virtual display both browsers draw WebGL with Mesa's software OpenGL, where headless
      # Firefox draws nothing and headless Chromium falls back to SwiftShader, which is many times slower.
      - run: xvfb-run -a pnpm exec playwright test e2e/${{ matrix.suite }}.spec.mjs --project=${{ matrix.engine }} $PART $SHARD
        env:
          E2E_HEADED: '1'

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failure-${{ matrix.suite }}${{ matrix.part && format('-{0}', matrix.part) || '' }}${{ matrix.share && format('-{0}', matrix.share) || '' }}-${{ matrix.engine }}
          path: |
            app.log
            playwright-report/
            test-results/
