<!doctype html>
<!-- Dark only: shadcn/ui's "dark:" variants key off this class. -->
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0c0b0e" />
    <meta
      name="description"
      content="Grim Repo - a card game of sacrifices, played on floppy disks against P03 in his factory."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Added to a home screen, the site opens on its own without the browser's bars; iPhones read the apple tags. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Grim Repo" />
    <!-- The link preview, as chats and social sites show it; the image is drawn by docs/tools/social-image.mjs. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Grim Repo" />
    <meta property="og:title" content="Grim Repo" />
    <meta
      property="og:description"
      content="A card game of sacrifices, played on floppy disks against P03 in his factory. Play as a guest; no sign-up."
    />
    <meta property="og:url" content="https://grimrepo.up.railway.app/" />
    <meta property="og:image" content="https://grimrepo.up.railway.app/social.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The Grim Repo README: its title, six pixel-art cards, and P03 at his terminal saying this is his repository now."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- The type every page opens with, fetched beside the stylesheet, so text never reflows when it arrives. -->
    <link
      rel="preload"
      href="/node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-500-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-500-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/node_modules/@fontsource/vt323/files/vt323-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>Grim Repo</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
