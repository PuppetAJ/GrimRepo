<!-- Half the RAM stick, mirrored for the other half: a nine-slice with slices of 2, 10, 10 and 10 from the top, right, bottom and left. -->
<svg xmlns="http://www.w3.org/2000/svg" width="48" height="40" viewBox="0 0 48 40">
  <polygon fill="#2f6c3d" points="0,0 48,0 48,34 43,34 43,40 0,40 0,26 5,26 5,14 0,14" />
  <polygon fill="#0a0e0a" points="2,0 48,0 48,32 41,32 41,38 2,38 2,28 7,28 7,12 2,12" />
</svg>
